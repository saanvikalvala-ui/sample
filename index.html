<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComicAI Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <header class="navbar">
        <div class="logo">ComicAI</div>

        <nav>
            <a href="#home">Home</a>
            <a href="#comicSection">Create</a>
            <a href="#community">Community</a>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero" id="home">
        <h1>Create Comics with AI</h1>
        <p>Turn simple ideas into fully illustrated comic strips.</p>
    </section>

    <!-- Comic Creator -->
    <section class="creator-box">
        <h2>Create Your Comic</h2>

        <textarea
            id="promptInput"
            placeholder="Example: A robot discovers magic in a futuristic city..."
        ></textarea>

        <fieldset class="genre-picker">
            <legend>Choose your comic type</legend>
            <label class="genre-option">
                <input type="radio" name="comicType" value="Superhero" checked>
                <span>
                    <svg class="genre-art superhero-art" viewBox="0 0 160 100" role="img" aria-label="Illustration of a superhero above a city">
                        <rect width="160" height="100" rx="12" fill="#172554"/>
                        <path d="M0 76h22V58h19v18h12V45h22v31h13V55h18v21h13V39h20v37h21v24H0z" fill="#1e3a8a"/>
                        <path d="m22 74 16-17 18 17-8 26H30z" fill="#ef4444"/>
                        <circle cx="39" cy="36" r="13" fill="#fbbf24"/>
                        <path d="M28 35c1-16 23-19 28-2-7-4-17-3-28 2" fill="#1f2937"/>
                        <path d="m27 50 12-7 13 8 7 23H20z" fill="#2563eb"/>
                        <path d="m35 51 4-5 5 5-5 7z" fill="#facc15"/>
                        <path d="m122 15 3 8 8 3-8 3-3 8-3-8-8-3 8-3zM83 17l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#fde68a"/>
                        <path d="m64 32 3 7 7 2-7 3-3 7-3-7-7-3 7-2z" fill="#fca5a5"/>
                    </svg>
                    <strong>Superhero</strong>
                    <small>Bold heroes &amp; action</small>
                </span>
            </label>
            <label class="genre-option">
                <input type="radio" name="comicType" value="Sci-Fi">
                <span>
                    <svg class="genre-art scifi-art" viewBox="0 0 160 100" role="img" aria-label="Illustration of a rocket in outer space">
                        <rect width="160" height="100" rx="12" fill="#0f172a"/>
                        <circle cx="126" cy="25" r="15" fill="#8b5cf6"/>
                        <path d="M114 24c7-7 17-8 25-2-4 11-14 16-25 13z" fill="#c4b5fd"/>
                        <circle cx="25" cy="22" r="2" fill="#fff"/>
                        <circle cx="54" cy="15" r="2" fill="#fff"/>
                        <circle cx="143" cy="59" r="2" fill="#fff"/>
                        <circle cx="35" cy="48" r="1.5" fill="#bfdbfe"/>
                        <circle cx="90" cy="19" r="1.5" fill="#bfdbfe"/>
                        <path d="M57 69c11-26 32-42 53-45-3 21-19 42-45 53z" fill="#e2e8f0"/>
                        <path d="m100 34 15-10-3 19z" fill="#38bdf8"/>
                        <path d="m68 70-7 16 18-11z" fill="#38bdf8"/>
                        <circle cx="88" cy="56" r="7" fill="#38bdf8" stroke="#1e3a8a" stroke-width="3"/>
                        <path d="m61 74-13 13 16-5M68 81l-8 13 15-10" fill="#fb923c"/>
                        <path d="m27 70 3 7 7 3-7 2-3 7-2-7-7-2 7-3zM78 24l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#fde68a"/>
                    </svg>
                    <strong>Sci-Fi</strong>
                    <small>Space &amp; future worlds</small>
                </span>
            </label>
        </fieldset>

        <div class="controls">
            <select id="styleSelect">
                <option>Comic Book</option>
                <option>Manga</option>
                <option>Cartoon</option>
            </select>

            <select id="panelCount">
                <option value="4">4 Panels</option>
                <option value="6">6 Panels</option>
                <option value="8">8 Panels</option>
            </select>
        </div>

        <label class="learning-mode">
            <input type="checkbox">
            Educational Comic Mode
        </label>

        <button id="generateBtn">Generate Comic</button>
    </section>

    <!-- Character Builder -->
    <section class="character-builder">
        <h2>Main Character</h2>

        <input
            type="text"
            id="characterName"
            placeholder="Character Name">

        <textarea
            id="characterDescription"
            placeholder="Describe your character..."
        ></textarea>
    </section>

    <!-- Comic Output -->
    <section id="comicSection">
        <h2>Your Comic</h2>

        <div class="comic-grid"></div>
    </section>

    <!-- Download Buttons -->
    <section class="download-section">
        <button>Download PNG</button>
        <button>Download PDF</button>
        <button>Share Comic</button>
    </section>

    <!-- Community Section -->
    <section class="community" id="community">
        <h2>Join the ComicAI Community</h2>
        <div class="community-grid">
            <div class="community-card">Create and share your comic ideas.</div>
        </div>
    </section>

    <footer>
        <p>ComicAI Studio</p>
    </footer>

    <script src="comic.js"></script>
</body>
</html>
